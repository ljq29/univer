<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univer 表格</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            font-size: 12px;
        }

        #univer-siyuan-plugin--tools {
            position: relative;
            z-index: 10000;
            display: flex;
            flex: 0 0 auto;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            padding: 4px 6px;
            border-bottom: 1px solid #d9d9d9;
            background: #fff;
        }

        button,
        select,
        summary {
            min-height: 26px;
            padding: 2px 6px;
            border: 1px solid #c9c9c9;
            border-radius: 3px;
            background: #fff;
            color: #222;
            font: inherit;
        }

        button,
        summary {
            cursor: pointer;
        }

        button:disabled,
        select:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        #univer-siyuan-plugin--group-menu {
            position: relative;
        }

        #univer-siyuan-plugin--group-menu summary {
            display: flex;
            align-items: center;
            list-style: none;
            user-select: none;
        }

        #univer-siyuan-plugin--group-menu summary::-webkit-details-marker {
            display: none;
        }

        #univer-siyuan-plugin--group-actions {
            position: absolute;
            top: 30px;
            left: 0;
            display: grid;
            grid-template-columns: repeat(2, max-content);
            gap: 4px;
            padding: 6px;
            border: 1px solid #c9c9c9;
            border-radius: 4px;
            background: #fff;
            box-shadow: 0 3px 12px rgb(0 0 0 / 18%);
        }

        #univer-siyuan-plugin--status {
            overflow: hidden;
            max-width: 260px;
            color: #666;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #univer-siyuan-plugin--app {
            flex: 1 1 auto;
            min-height: 0;
            overscroll-behavior: contain;
        }
    </style>
</head>

<body>
    <div id="univer-siyuan-plugin--tools">
        <label for="univer-siyuan-plugin--font">字体</label>
        <select id="univer-siyuan-plugin--font" title="设置当前选区字体">
            <option value="">选择字体</option>
            <option value="Arial">Arial</option>
            <option value="Calibri">Calibri</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Microsoft YaHei">微软雅黑</option>
            <option value="SimSun">宋体</option>
            <option value="SimHei">黑体</option>
            <option value="KaiTi">楷体</option>
            <option value="monospace">等宽字体</option>
        </select>
        <button id="univer-siyuan-plugin--import" type="button">导入 Excel</button>
        <button id="univer-siyuan-plugin--export" type="button">导出 Excel</button>
        <details id="univer-siyuan-plugin--group-menu">
            <summary>行列分组</summary>
            <div id="univer-siyuan-plugin--group-actions">
                <button type="button" data-group="create-row">行：创建分组</button>
                <button type="button" data-group="create-column">列：创建分组</button>
                <button type="button" data-group="collapse-row">行：折叠</button>
                <button type="button" data-group="collapse-column">列：折叠</button>
                <button type="button" data-group="expand-row">行：展开</button>
                <button type="button" data-group="expand-column">列：展开</button>
                <button type="button" data-group="remove-row">行：取消分组</button>
                <button type="button" data-group="remove-column">列：取消分组</button>
                <button type="button" data-group="expand-all">当前表全部展开</button>
            </div>
        </details>
        <span id="univer-siyuan-plugin--status" role="status" aria-live="polite"></span>
        <input id="univer-siyuan-plugin--file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    </div>
    <div id="univer-siyuan-plugin--app"></div>
    <script>var process = { env: { NODE_ENV: "production" } }</script>
    <script type="module">
        const dev = import.meta.env?.MODE === 'development'
        if (dev) {
            import('/src/univer-siyuan-plugin/univer.ts')
        } else {
            // 生产环境下的动态导入，避免编译时加载
            eval(`import('/plugins/univer-siyuan-plugin/es/univer.js')`)
        }
    </script>
</body>

</html>
